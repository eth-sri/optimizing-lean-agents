# Base config for the one-stage logistic pipeline.
#
# Trains on proof similarity, error diversity, and 1/x:num_attempts from
# fixed_feature_tracker_full_router. Override --features / --output-path
# to train feature-subset variants.
sources:
  8b:
    type: simulation
    trajectory_dir: "results/simulations/fixed_feature_tracker_full_router"
    skip_first: 2
features:
  - "normalized_similarity"
  - "error_diversity"
  - "1/x:num_attempts"
# Full superset mapping. Subset variants only look up the features they list,
# so the extra keys here are harmless.
feature_mapping:
  normalized_similarity: "normalized_similarity"
  error_diversity: "error_diversity"
  num_attempts: "num_attempts"
C: 1.0
output_path: "models/onestage_logistic_train.json"
